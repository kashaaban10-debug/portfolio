<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المهمة المستحيلة: أسرار الحملة الفرنسية</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Lalezar&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Almarai', 'sans-serif'],
                        epic: ['Lalezar', 'cursive'],
                    },
                    colors: {
                        neon: {
                            blue: '#00f3ff',
                            red: '#ff003c',
                            gold: '#ffd700',
                            purple: '#b026ff'
                        },
                        dark: {
                            base: '#050505',
                            panel: '#111111',
                            card: '#1a1a2e'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* =========================================
           الخلفية والتأثيرات العامة
           ========================================= */
        body {
            background-color: #050505;
            color: #ffffff;
            overflow-x: hidden;
            font-family: 'Almarai', sans-serif;
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .glass-panel {
            background: rgba(17, 17, 17, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        }

        .text-glow-gold { text-shadow: 0 0 10px #ffd700, 0 0 20px #ffd700, 0 0 40px #d4af37; }
        .text-glow-blue { text-shadow: 0 0 10px #00f3ff, 0 0 20px #00f3ff; }
        .text-glow-red { text-shadow: 0 0 10px #ff003c, 0 0 20px #ff003c; }

        /* =========================================
           حركات الأنميشن
           ========================================= */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .animate-float { animation: float 4s ease-in-out infinite; }

        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        .pulse-ring::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid #00f3ff;
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        @keyframes cinematic-intro {
            0% { transform: scale(1.5) translateZ(-500px); opacity: 0; filter: blur(10px); }
            100% { transform: scale(1) translateZ(0); opacity: 1; filter: blur(0); }
        }
        .animate-cinematic { animation: cinematic-intro 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }

        /* =========================================
           لعبة مبارزة البطاقات (3D Cards)
           ========================================= */
        .perspective-1000 { perspective: 1000px; }
        .preserve-3d { transform-style: preserve-3d; }
        
        .epic-card {
            transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            border: 2px solid transparent;
            background-clip: padding-box;
            position: relative;
        }
        .epic-card::after {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, #00f3ff, #b026ff, #ff003c, #ffd700);
            z-index: -1;
            border-radius: inherit;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .epic-card:hover {
            transform: translateY(-20px) rotateY(10deg) rotateX(10deg);
            box-shadow: -20px 20px 30px rgba(0,0,0,0.5);
        }
        .epic-card:hover::after { opacity: 1; }

        .card-clash-anim {
            animation: clash 1s forwards;
        }
        @keyframes clash {
            0% { transform: scale(1); }
            50% { transform: scale(1.2) translateY(-50px); filter: brightness(2); }
            100% { transform: scale(0); opacity: 0; }
        }

        /* =========================================
           الرادار (Radar Game)
           ========================================= */
        .radar-box {
            position: relative;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            border: 2px solid #00f3ff;
            background: 
                radial-gradient(circle, rgba(0, 243, 255, 0.1) 0%, transparent 70%),
                repeating-radial-gradient(transparent, transparent 48px, rgba(0, 243, 255, 0.3) 50px);
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.2), inset 0 0 20px rgba(0, 243, 255, 0.5);
        }
        .radar-sweep {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150px;
            height: 150px;
            background: conic-gradient(from 0deg, transparent 70%, rgba(0, 243, 255, 0.8) 100%);
            transform-origin: 0 0;
            animation: sweep 4s linear infinite;
        }
        @keyframes sweep {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .radar-target {
            position: absolute;
            width: 15px;
            height: 15px;
            background-color: #ff003c;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff003c, 0 0 20px #ff003c;
            animation: blink 1s infinite;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .radar-target:hover { transform: scale(1.5); }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* =========================================
           الخزنة (Safe Vault Game)
           ========================================= */
        .numpad-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 243, 255, 0.3);
            color: #00f3ff;
            transition: all 0.2s;
            text-shadow: 0 0 5px #00f3ff;
        }
        .numpad-btn:hover {
            background: rgba(0, 243, 255, 0.2);
            box-shadow: 0 0 15px #00f3ff;
            transform: scale(1.05);
        }
        .numpad-btn:active { transform: scale(0.95); }
        
        .vault-display {
            font-family: 'Lalezar', monospace;
            letter-spacing: 15px;
            text-shadow: 0 0 20px #ffd700;
        }

    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Canvas for Particle Effects (النار والشرار) -->
    <canvas id="particle-canvas"></canvas>

    <!-- Header -->
    <header class="p-4 relative z-10">
        <div class="container mx-auto flex justify-between items-center glass-panel rounded-2xl px-6 py-3">
            <h1 class="text-3xl font-epic text-neon-gold text-glow-gold flex items-center gap-3">
                <i class="fa-solid fa-eye text-neon-red"></i> نظام "حورس" الاستراتيجي
            </h1>
            <button onclick="showDashboard()" id="homeBtn" style="display: none;" class="bg-transparent border-2 border-neon-blue text-neon-blue hover:bg-neon-blue hover:text-dark-base px-6 py-2 rounded-full font-bold transition-all shadow-[0_0_15px_rgba(0,243,255,0.4)]">
                <i class="fa-solid fa-satellite-dish"></i> العودة للمركز
            </button>
        </div>
    </header>

    <!-- Main Game Container -->
    <main id="gameContainer" class="flex-grow container mx-auto p-4 flex items-center justify-center relative z-10 w-full h-full my-8">
        <!-- Content injected by JS -->
    </main>

    <script>
        // ==========================================
        // 1. نظام الجزيئات (Particle System - Sparks)
        // ==========================================
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 100;
                this.size = Math.random() * 3 + 1;
                this.speedY = Math.random() * -2 - 0.5;
                this.speedX = Math.random() * 2 - 1;
                this.color = Math.random() > 0.5 ? '#ff4500' : '#ffd700';
                this.life = Math.random() * 100 + 50;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.life--;
                if (this.life <= 0) {
                    this.y = canvas.height + 10;
                    this.life = Math.random() * 100 + 50;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.life / 150;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 100; i++) particles.push(new Particle());

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // ==========================================
        // 2. الواجهة الرئيسية (Dashboard)
        // ==========================================
        const container = document.getElementById('gameContainer');
        const homeBtn = document.getElementById('homeBtn');

        function showDashboard() {
            homeBtn.style.display = 'none';
            container.innerHTML = `
                <div class="w-full max-w-6xl animate-cinematic">
                    <div class="text-center mb-16 relative">
                        <h2 class="text-6xl font-epic text-transparent bg-clip-text bg-gradient-to-r from-neon-red via-neon-gold to-neon-red text-glow-red mb-4 drop-shadow-2xl uppercase tracking-widest">المهمة المستحيلة</h2>
                        <p class="text-2xl text-gray-400 font-bold tracking-wide">أرشيف أسرار الحملة الفرنسية (1798) - غير مصرح بالدخول</p>
                        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-full h-1 bg-neon-red opacity-20 blur-md z-[-1]"></div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-10 px-4 perspective-1000">
                        
                        <!-- المهمة 1: البطاقات -->
                        <div onclick="initCardDuel()" class="epic-card glass-panel rounded-3xl p-8 text-center cursor-pointer group flex flex-col items-center">
                            <div class="w-32 h-32 rounded-full border-4 border-neon-blue flex items-center justify-center text-6xl text-neon-blue mb-6 group-hover:scale-110 transition-transform shadow-[0_0_30px_rgba(0,243,255,0.3)] pulse-ring relative">
                                <i class="fa-solid fa-layer-group"></i>
                            </div>
                            <h3 class="text-3xl font-epic text-white mb-3 group-hover:text-neon-blue transition-colors">مبارزة الأبطال</h3>
                            <p class="text-gray-400 text-lg">استخدم البطاقة التاريخية الصحيحة لهزيمة التحدي.</p>
                        </div>

                        <!-- المهمة 2: الرادار -->
                        <div onclick="initRadarGame()" class="epic-card glass-panel rounded-3xl p-8 text-center cursor-pointer group flex flex-col items-center mt-0 md:-mt-10">
                            <div class="w-32 h-32 rounded-full border-4 border-neon-red flex items-center justify-center text-6xl text-neon-red mb-6 group-hover:scale-110 transition-transform shadow-[0_0_30px_rgba(255,0,60,0.3)] pulse-ring relative" style="--tw-ring-color: #ff003c;">
                                <i class="fa-solid fa-satellite-dish"></i>
                            </div>
                            <h3 class="text-3xl font-epic text-white mb-3 group-hover:text-neon-red transition-colors">الرادار الاستراتيجي</h3>
                            <p class="text-gray-400 text-lg">التقط الأهداف المعادية على الخريطة وأجب بسرعة.</p>
                        </div>

                        <!-- المهمة 3: الخزنة -->
                        <div onclick="initVaultGame()" class="epic-card glass-panel rounded-3xl p-8 text-center cursor-pointer group flex flex-col items-center">
                            <div class="w-32 h-32 rounded-full border-4 border-neon-gold flex items-center justify-center text-6xl text-neon-gold mb-6 group-hover:scale-110 transition-transform shadow-[0_0_30px_rgba(255,215,0,0.3)] pulse-ring relative" style="--tw-ring-color: #ffd700;">
                                <i class="fa-solid fa-vault"></i>
                            </div>
                            <h3 class="text-3xl font-epic text-white mb-3 group-hover:text-neon-gold transition-colors">خزنة الأسرار</h3>
                            <p class="text-gray-400 text-lg">حلل الأحداث التاريخية لاستنتاج رمز المرور السري.</p>
                        </div>
                    </div>
                </div>
            `;
        }

        // ==========================================
        // 3. المهمة 1: مبارزة الأبطال (Card Duel)
        // ==========================================
        const duels = [
            { enemy: "أسطول إنجليزي دمر آمال فرنسا في البحر المتوسط!", correct: "نيلسون", cards: ["نابليون", "مراد بك", "نيلسون"], icon: "fa-ship" },
            { enemy: "ثورة عارمة تشتعل من حي بولاق!", correct: "عمر مكرم", cards: ["محمد كريم", "عمر مكرم", "كليبر"], icon: "fa-fire" },
            { enemy: "معاهدة فاشلة للخروج من مصر (العريش)!", correct: "كليبر", cards: ["مينو", "نابليون", "كليبر"], icon: "fa-file-signature" },
            { enemy: "حاكم الإسكندرية الذي قاوم بشراسة وأُعدم!", correct: "محمد كريم", cards: ["عمر مكرم", "محمد كريم", "إبراهيم بك"], icon: "fa-shield-halved" },
            { enemy: "القائد الذي هرب سراً تاركاً الحملة في ورطة!", correct: "نابليون", cards: ["مينو", "كليبر", "نابليون"], icon: "fa-person-running" },
            { enemy: "قائد فرنسي أعلن إسلامه ونوى البقاء في مصر!", correct: "مينو", cards: ["مينو", "بوشار", "كليبر"], icon: "fa-mosque" }
        ];
        let currentDuel = 0;

        function initCardDuel() {
            currentDuel = 0;
            homeBtn.style.display = 'block';
            renderDuel();
        }

        function renderDuel() {
            if(currentDuel >= duels.length) {
                showEpicVictory("انتصار تاريخي!", "لقد أثبتّ جدارتك كقائد عظيم في ساحة المعركة.");
                return;
            }
            const duel = duels[currentDuel];
            const shuffledCards = [...duel.cards].sort(() => Math.random() - 0.5);

            container.innerHTML = `
                <div class="w-full max-w-5xl animate-cinematic flex flex-col items-center">
                    
                    <!-- منطقة العدو (التهديد) -->
                    <div class="glass-panel p-8 rounded-3xl border-b-4 border-neon-red text-center mb-16 relative w-3/4 animate-float">
                        <div class="absolute -top-10 left-1/2 transform -translate-x-1/2 bg-dark-base rounded-full p-4 border-2 border-neon-red">
                            <i class="fa-solid ${duel.icon} text-4xl text-neon-red text-glow-red"></i>
                        </div>
                        <h2 class="text-3xl font-bold text-white mt-4 tracking-wide">${duel.enemy}</h2>
                        <p class="text-neon-red mt-2 animate-pulse">تحذير! التهديد يقترب... اختر بطاقة للرد!</p>
                    </div>

                    <!-- منطقة اللاعب (البطاقات) -->
                    <div class="flex justify-center gap-8 perspective-1000 w-full" id="playerCards">
                        ${shuffledCards.map((card, index) => `
                            <div onclick="playCard(this, '${card}', '${duel.correct}')" class="epic-card glass-panel w-64 h-80 rounded-2xl flex flex-col items-center justify-center cursor-pointer border border-gray-700 shadow-2xl relative overflow-hidden group">
                                <!-- Card Hologram effect -->
                                <div class="absolute inset-0 bg-gradient-to-br from-white/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                                <div class="text-6xl text-neon-blue mb-6 drop-shadow-[0_0_15px_rgba(0,243,255,0.8)]">
                                    <i class="fa-solid fa-user-shield"></i>
                                </div>
                                <h3 class="text-3xl font-epic text-white group-hover:text-neon-gold transition-colors">${card}</h3>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function playCard(element, selectedCard, correctCard) {
            // تعطيل النقر
            document.getElementById('playerCards').style.pointerEvents = 'none';
            
            // أنميشن الهجوم
            element.classList.add('card-clash-anim');

            setTimeout(() => {
                if(selectedCard === correctCard) {
                    showEffect('success');
                    setTimeout(() => { currentDuel++; renderDuel(); }, 2000);
                } else {
                    showEffect('fail');
                    setTimeout(() => { renderDuel(); }, 2000); // إعادة المحاولة
                }
            }, 1000);
        }

        // ==========================================
        // 4. المهمة 2: الرادار الاستراتيجي (Radar)
        // ==========================================
        const radarTargets = [
            { id: 1, top: '20%', left: '30%', q: "أين وقعت أول مقاومة شعبية ضد الحملة الفرنسية؟", a: ["الإسكندرية", "القاهرة", "شبراخيت"], ans: 0 },
            { id: 2, top: '70%', left: '60%', q: "أين تحطم الأسطول الفرنسي؟", a: ["أبي قير", "إمبابة", "عكا"], ans: 0 },
            { id: 3, top: '40%', left: '80%', q: "إلى أين هرب إبراهيم بك والوالي العثماني بعد إمبابة؟", a: ["الصعيد", "الشام", "السودان"], ans: 1 },
            { id: 4, top: '80%', left: '20%', q: "المعركة التي هرب بعدها مراد بك للصعيد؟", a: ["شبراخيت", "أبي قير البرية", "إمبابة"], ans: 2 },
            { id: 5, top: '50%', left: '50%', q: "ما هو المركز الرئيسي لثورة القاهرة الأولى؟", a: ["حي بولاق", "الجامع الأزهر", "قلعة قايتباي"], ans: 1 },
            { id: 6, top: '10%', left: '10%', q: "من أي ميناء فرنسي خرجت الحملة سراً؟", a: ["مارسيليا", "طولون", "بوردو"], ans: 1 }
        ];
        let currentTargets = [];

        function initRadarGame() {
            currentTargets = [...radarTargets];
            homeBtn.style.display = 'block';
            renderRadarMain();
        }

        function renderRadarMain() {
            if(currentTargets.length === 0) {
                showEpicVictory("تم تأمين الخريطة!", "لقد قمت بتحييد جميع الأهداف بنجاح باهر.");
                return;
            }

            container.innerHTML = `
                <div class="w-full max-w-4xl glass-panel rounded-3xl p-10 animate-cinematic flex flex-col md:flex-row items-center gap-12">
                    
                    <!-- Radar Display -->
                    <div class="radar-box shrink-0">
                        <div class="radar-sweep"></div>
                        ${currentTargets.map((t, index) => `
                            <div class="radar-target" style="top: ${t.top}; left: ${t.left};" onclick="openRadarQuestion(${index})"></div>
                        `).join('')}
                    </div>

                    <!-- Info Panel -->
                    <div class="flex-1 text-right border-r-4 border-neon-blue pr-8">
                        <h2 class="text-4xl font-epic text-neon-blue text-glow-blue mb-4">نظام مسح الخرائط</h2>
                        <p class="text-xl text-gray-300 mb-6">يوجد <span class="text-neon-red font-bold text-2xl">${currentTargets.length}</span> أهداف مجهولة على الرادار.<br>اضغط على النقاط الحمراء الوامضة لاعتراض الهدف.</p>
                        
                        <div class="flex gap-2">
                            ${Array(6 - currentTargets.length).fill(0).map(() => `<div class="w-8 h-3 bg-neon-blue rounded shadow-[0_0_10px_rgba(0,243,255,0.8)]"></div>`).join('')}
                            ${currentTargets.map(() => `<div class="w-8 h-3 bg-gray-700 rounded"></div>`).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function openRadarQuestion(index) {
            const target = currentTargets[index];
            
            container.innerHTML = `
                <div class="w-full max-w-2xl glass-panel rounded-3xl p-10 animate-cinematic border-2 border-neon-red relative overflow-hidden">
                    <div class="absolute inset-0 bg-neon-red opacity-10 animate-pulse"></div>
                    <div class="relative z-10 text-center">
                        <i class="fa-solid fa-crosshairs text-6xl text-neon-red mb-6 animate-spin" style="animation-duration: 3s;"></i>
                        <h2 class="text-3xl font-bold text-white mb-10 leading-relaxed">${target.q}</h2>
                        
                        <div class="flex flex-col gap-4">
                            ${target.a.map((opt, i) => `
                                <button onclick="answerRadar(${index}, ${i === target.ans})" class="glass-panel text-white text-xl py-4 rounded-xl hover:bg-neon-red hover:text-white hover:shadow-[0_0_20px_rgba(255,0,60,0.8)] transition font-bold border border-gray-600">
                                    ${opt}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function answerRadar(index, isCorrect) {
            if(isCorrect) {
                showEffect('success');
                currentTargets.splice(index, 1);
                setTimeout(() => renderRadarMain(), 1500);
            } else {
                showEffect('fail');
                setTimeout(() => renderRadarMain(), 1500);
            }
        }

        // ==========================================
        // 5. المهمة 3: خزنة الأسرار (The Vault)
        // ==========================================
        let vaultCode = "";
        const targetCode = "3713"; // 3 (سنوات الحملة) - 7 (شهر وصول الحملة يوليو) - 1 (ثورة 1) - 3 (عدد قادة الحملة)
        
        function initVaultGame() {
            vaultCode = "";
            homeBtn.style.display = 'block';
            renderVault();
        }

        function renderVault() {
            container.innerHTML = `
                <div class="w-full max-w-5xl flex flex-col md:flex-row gap-8 animate-cinematic items-stretch">
                    
                    <!-- لوحة التلميحات (Intel) -->
                    <div class="flex-1 glass-panel rounded-3xl p-8 border-t-4 border-neon-gold flex flex-col">
                        <h2 class="text-3xl font-epic text-neon-gold text-glow-gold mb-6 border-b border-gray-700 pb-4">
                            <i class="fa-solid fa-file-shield"></i> استخبارات المهمة
                        </h2>
                        <ul class="space-y-6 text-xl text-gray-300 flex-grow">
                            <li class="flex items-start gap-4">
                                <span class="text-neon-gold font-bold">الرقم 1:</span> كم عدد السنوات التي قضتها الحملة الفرنسية في مصر؟ (1798 - 1801)
                            </li>
                            <li class="flex items-start gap-4">
                                <span class="text-neon-gold font-bold">الرقم 2:</span> رقم الشهر الميلادي الذي وصلت فيه الحملة لشواطئ الإسكندرية؟ (يوليو)
                            </li>
                            <li class="flex items-start gap-4">
                                <span class="text-neon-gold font-bold">الرقم 3:</span> ثورة القاهرة كانت الثورة الـ... (الأولى) اكتب رقماً.
                            </li>
                            <li class="flex items-start gap-4">
                                <span class="text-neon-gold font-bold">الرقم 4:</span> كم عدد قادة الحملة الفرنسية المتعاقبين؟ (نابليون، كليبر، مينو)
                            </li>
                        </ul>
                    </div>

                    <!-- واجهة الخزنة (Numpad) -->
                    <div class="w-full md:w-96 glass-panel rounded-3xl p-8 bg-[#0a0a0a] flex flex-col items-center shadow-[inset_0_0_50px_rgba(0,0,0,1)] border-2 border-gray-800">
                        <!-- الشاشة -->
                        <div class="w-full h-24 bg-black border-2 border-neon-blue rounded-xl mb-8 flex items-center justify-center shadow-[0_0_15px_rgba(0,243,255,0.2)]">
                            <span class="vault-display text-5xl text-neon-blue">${vaultCode.padEnd(4, '_')}</span>
                        </div>

                        <!-- الأزرار -->
                        <div class="grid grid-cols-3 gap-4 w-full" dir="ltr">
                            ${[1,2,3,4,5,6,7,8,9].map(n => `
                                <button onclick="pressNumpad(${n})" class="numpad-btn h-16 rounded-lg text-2xl font-bold flex items-center justify-center">
                                    ${n}
                                </button>
                            `).join('')}
                            <button onclick="pressNumpad('C')" class="numpad-btn h-16 rounded-lg text-xl font-bold flex items-center justify-center text-neon-red border-neon-red hover:bg-neon-red hover:text-white">C</button>
                            <button onclick="pressNumpad(0)" class="numpad-btn h-16 rounded-lg text-2xl font-bold flex items-center justify-center">0</button>
                            <button onclick="checkVault()" class="numpad-btn h-16 rounded-lg text-xl font-bold flex items-center justify-center text-neon-gold border-neon-gold hover:bg-neon-gold hover:text-black"><i class="fa-solid fa-unlock-keyhole"></i></button>
                        </div>
                    </div>
                </div>
            `;
        }

        function pressNumpad(val) {
            if (val === 'C') {
                vaultCode = "";
            } else if (vaultCode.length < 4) {
                vaultCode += val;
            }
            renderVault();
        }

        function checkVault() {
            if (vaultCode === targetCode) {
                showEpicVictory("تم فتح الخزنة!", "لقد حصلت على الوثائق السرية للحملة، مهاراتك التحليلية استثنائية.");
            } else {
                showEffect('fail');
                vaultCode = "";
                setTimeout(() => renderVault(), 1000);
            }
        }

        // ==========================================
        // 6. تأثيرات بصرية للنجاح والفشل
        // ==========================================
        function showEffect(type) {
            const overlay = document.createElement('div');
            overlay.className = `fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm transition-opacity duration-300`;
            
            const icon = type === 'success' ? 'fa-check-circle text-neon-blue text-glow-blue' : 'fa-skull text-neon-red text-glow-red';
            const text = type === 'success' ? 'إجابة صحيحة' : 'خطأ استراتيجي';
            const color = type === 'success' ? 'text-neon-blue' : 'text-neon-red';

            overlay.innerHTML = `
                <div class="text-center transform scale-150 animate-cinematic">
                    <i class="fa-solid ${icon} text-9xl mb-4"></i>
                    <h2 class="text-5xl font-epic ${color} tracking-widest">${text}</h2>
                </div>
            `;
            
            document.body.appendChild(overlay);
            setTimeout(() => {
                overlay.style.opacity = '0';
                setTimeout(() => overlay.remove(), 300);
            }, 1200);
        }

        function showEpicVictory(title, msg) {
            container.innerHTML = `
                <div class="w-full max-w-3xl glass-panel rounded-full p-16 text-center animate-cinematic relative overflow-hidden shadow-[0_0_100px_rgba(255,215,0,0.3)] border-4 border-neon-gold">
                    <!-- Rays -->
                    <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxkZWZzPjxyYWRpYWxHcmFkaWVudCBpZD0iZyIgY3g9IjUwJSIgY3k9IjUwJSIgcj0iNTAlIj48c3RvcCBvZmZzZXQ9IjAlIiBzdG9wLWNvbG9yPSIjZmZkNzAwIiBzdG9wLW9wYWNpdHk9IjAuNSIvPjxzdG9wIG9mZnNldD0iMTAwJSIgc3RvcC1jb2xvcj0iI2ZmZDcwMCIgc3RvcC1vcGFjaXR5PSIwIi8+PC9yYWRpYWxHcmFkaWVudD48L2RlZnM+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsbD0idXJsKCNnKSIvPjwvc3ZnPg==')] opacity-30 animate-spin" style="animation-duration: 20s;"></div>
                    
                    <div class="relative z-10">
                        <i class="fa-solid fa-medal text-9xl text-neon-gold text-glow-gold mb-8 animate-float"></i>
                        <h2 class="text-5xl font-epic text-white mb-6 drop-shadow-2xl">${title}</h2>
                        <p class="text-2xl text-gray-300 mb-12 font-bold leading-relaxed">${msg}</p>
                        
                        <button onclick="showDashboard()" class="bg-gradient-to-r from-neon-gold to-yellow-600 text-black text-2xl font-epic py-4 px-12 rounded-full hover:scale-105 transition-transform shadow-[0_0_30px_rgba(255,215,0,0.6)]">
                            العودة لمركز القيادة
                        </button>
                    </div>
                </div>
            `;
        }

        // بدء التشغيل
        window.onload = showDashboard;

    </script>
</body>
</html>
